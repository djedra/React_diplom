<!doctype html>
<html lang="ru"> 
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosa Noga - Интернет-магазин обуви</title>
    <meta name="description" content="Интернет-магазин качественной обуви Bosa Noga">
    
    
    <link rel="icon" type="image/svg+xml" href="/hiking-boot.svg" />
    <link rel="apple-touch-icon" href="/hiking-boot.svg">
    
    
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" 
          integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" 
          crossorigin="anonymous">
    
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" 
          integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" 
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    
    <link rel="stylesheet" href="/css/style.css">
    
    
    <link rel="preconnect" href="https://stackpath.bootstrapcdn.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com/ajax/libs">
  </head>
  <body>
    
    <noscript>
      <div class="container mt-5">
        <div class="alert alert-warning" role="alert">
          <h4 class="alert-heading">Требуется JavaScript!</h4>
          <p>Для корректной работы сайта Bosa Noga необходимо включить JavaScript в настройках вашего браузера.</p>
        </div>
      </div>
    </noscript>
    
    <div id="root">
      
      <div class="preloader-container">
        <div class="spinner-border text-primary" role="status">
          <span class="sr-only">Загрузка...</span>
        </div>
        <p class="mt-3">Загрузка магазина Bosa Noga...</p>
      </div>
    </div>
    
    
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" 
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" 
            crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" 
            integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" 
            crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" 
            integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" 
            crossorigin="anonymous"></script>
    
    
    <script type="module" src="/src/main.tsx"></script>
    
    <style>
      
      .preloader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      
      
      #root:not(:empty) .preloader-container {
        display: none;
      }
    </style>
  </body>
</html>
